<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
      <defs>
        <linearGradient id="pGrad15" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FCEBF0" />
          <stop offset="60%" stop-color="#FFFFFF" />
          <stop offset="100%" stop-color="#FCEBF0" stop-opacity="0.5"/>
        </linearGradient>
      </defs>
      <rect width="100%" height="100%" fill="url(#pGrad15)" rx="28"/>
      
      <!-- Architectural Framing -->
      <rect x="25" y="25" width="550" height="700" rx="20" fill="none" stroke="#C58A9C" stroke-width="1.2" opacity="0.3"/>
      
      <!-- Badge Tag -->
      <g transform="translate(45, 50)">
        <rect width="130" height="26" rx="13" fill="#49383C" />
        <text x="65" y="17" text-anchor="middle" font-family="Poppins, sans-serif" font-size="9" font-weight="600" letter-spacing="1" fill="#FFFFFF">100% PURE</text>
      </g>

      <!-- Center Aesthetic Vignette -->
      <g transform="translate(300, 360)">
        <!-- Subtle Halo Circles -->
        <circle r="160" fill="#FFFFFF" opacity="0.6"/>
        <circle r="130" fill="none" stroke="#C58A9C" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
        <circle r="100" fill="#FFFFFF" filter="drop-shadow(0 12px 30px rgba(73, 56, 60, 0.09))"/>
        
        <!-- Large Icon Showcase -->
        <text y="32" text-anchor="middle" font-size="80">🌹</text>
      </g>

      <!-- Bottom Card Metadata -->
      <g transform="translate(300, 610)">
        <text text-anchor="middle" font-family="Poppins, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#C58A9C">SKINCARE</text>
        <text y="32" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-size="24" font-weight="600" fill="#49383C">Damask Rose Hydrating Elixir</text>
        <text y="58" text-anchor="middle" font-family="Poppins, sans-serif" font-size="12" font-weight="300" letter-spacing="0.5" fill="#756266">Handcrafted Boutique Elegance • CHÉRIE</text>
      </g>
    </svg>